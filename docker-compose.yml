name: como-funciona-0003-shopify

# Ocho servicios con un solo `docker compose up`. Los healthchecks y los
# depends_on con conditions son los que garantizan el orden: primero las bases,
# luego la creación de topics y recién después API y worker.
x-app-env: &app-env
  KAFKA_BROKERS: "kafka:9092"
  CLICKHOUSE_URL: "http://clickhouse:8123"
  CLICKHOUSE_USER: "shopify"
  CLICKHOUSE_PASSWORD: "shopify"

services:
  postgres:
    image: postgres:16-alpine
    container_name: shopify-postgres
    environment:
      POSTGRES_USER: shopify
      POSTGRES_PASSWORD: shopify
      POSTGRES_DB: shopify
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopify -d shopify"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: shopify-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    container_name: shopify-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  # kafka-init termina y sale; la API y el worker esperan a que termine para no
  # publicar en topics que todavía no existen. El script va en entrypoint como
  # un único bloque: con `command` separado, bash -c sólo recibía la ruta.
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: shopify-kafka-init
    entrypoint:
      - /bin/bash
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic order_created --partitions 1 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment_failed --partitions 1 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: shopify-clickhouse
    ports:
      - "8124:8123"
      - "9001:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/shopify-user.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  backend:
    build: ./backend
    container_name: shopify-backend
    environment:
      <<: *app-env
      PORT: "8080"
      PG_DSN: "postgres://shopify:shopify@postgres:5432/shopify?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      # El reset existe sólo en desarrollo: el backend no registra la ruta
      # /api/dev/reset si esta variable no es "true".
      ENABLE_DEV_ENDPOINTS: "true"
    # Puertos de host desplazados para no chocar con otros ejercicios del curso.
    # Dentro de la red de Compose se usan los puestos estándar (8080, 5432...).
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Mismo Dockerfile que la API, otro proceso. Separarlo permite que un pico
  # de checkout no compita con el consumo de Kafka por los mismos goroutines.
  order-worker:
    build: ./backend
    container_name: shopify-order-worker
    command: ["/app/server", "-worker"]
    environment:
      <<: *app-env
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    restart: on-failure

  frontend:
    build: ./frontend
    container_name: shopify-frontend
    ports:
      - "5175:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  clickhouse_data:
